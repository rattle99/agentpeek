[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentpeek"
version = "0.12.1"
description = "TUI inspector for agent CLI configuration directories like ~/.claude/."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "rattle99", email = "24495512+rattle99@users.noreply.github.com" }]
keywords = ["claude", "claude-code", "agent-cli", "tui", "textual", "config", "inspector"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.80.0",
    "python-frontmatter>=1.1.0",
]

[project.urls]
Homepage = "https://github.com/rattle99/agentpeek"
Repository = "https://github.com/rattle99/agentpeek"
Issues = "https://github.com/rattle99/agentpeek/issues"

[project.scripts]
agentpeek = "agentpeek.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentpeek"]

[tool.hatch.build.targets.sdist]
include = ["src/agentpeek", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TCH", "PTH", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
